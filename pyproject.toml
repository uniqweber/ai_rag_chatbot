[project]
name = "ai-rag-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rayan Ahmed", email = "uniqwebersocial@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.32",
    "dotenv>=0.9.9",
    "fonttools>=4.68.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.18",
    "pypdf>=6.21.4",
    "streamlit>=1.66.1",
]

[project.scripts]
ai-rag-chatbot = "ai_rag_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
